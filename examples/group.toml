[project]
name = "Hellenistic Survey 2024"
description = "Intensive survey of the upper Diyala basin"

[id]
prefix = "HS"
include_year = true
separator = "-"
pad_length = 4
start_at = 1

[srid]
default = 4326

[vocabularies]
periodisation = "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

[import.defaults]
date_type = "stratigraphic"
classification_delimiter = ";"
name_fallback_enabled = false
