version = 1

[type]
key = "finds"
label = "Small Find"
description = "A portable object recovered during excavation"

[id]
prefix = "SF"

[requires]
name = true
geometry = false

[properties]
material = { type = "string", enum = ["pottery", "bone", "metal", "glass", "stone", "organic"] }
quantity = { type = "number" }
weight = { type = "number" }
condition = { type = "string", enum = ["complete", "fragmentary", "burnt"] }

[sub_type.pottery]
label = "Pottery"
description = "Ceramic vessel sherds"
[sub_type.pottery.properties]
fabric = { type = "string" }
form = { type = "string" }
decoration = { type = "string" }

[sub_type.bone]
label = "Animal Bone"
description = "Faunal remains"
[sub_type.bone.properties]
species = { type = "string" }
element = { type = "string" }

[sub_type.metal]
label = "Metal Object"
description = "Metallic artefact"
[sub_type.metal.properties]
alloy = { type = "string" }
object_type = { type = "string" }

[classification]
vocabulary = "periodisation"
mode = "column"

[name]
template = "{material} find #{id}"

[import.from_qgis]
description = "Finds exported from QGIS"
format = "geojson"

[import.from_qgis.column.feature_id]
target = "source_id"

[import.from_qgis.column.material]
target = "material"

[import.from_qgis.column.period]
target = "classification"
